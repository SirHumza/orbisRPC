name: release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: checkout ps4-payload-sdk
        uses: actions/checkout@v5
        with:
          repository: ps4-payload-dev/sdk
          path: sdk
          fetch-depth: 0 # a raw SHA is not a branch/tag; checkout the repo then pin it
      - name: pin ps4-payload-sdk
        run: git -C sdk checkout 573b4a0 # Add 14.00 offsets; includes 959e4ed "Add 13.52 offsets"
      - name: install llvm
        run: sudo apt-get update -qq && sudo apt-get install -qy clang-18 lld-18 llvm-18
      - name: build SDK from source
        run: |
          make -C sdk DESTDIR="$HOME/ps4-payload-sdk" clean install
      - name: gate SDK firmware support
        run: |
          grep -q "case 0x1352:" sdk/crt/patch.c || {
            echo "FAIL: SDK lacks 13.52 offsets; payload cannot boot on 13.52"; exit 1; }
          echo "SDK has 13.52 offsets"
      - name: build SDK daemon payload
        run: |
          export PS4_PAYLOAD_SDK="$HOME/ps4-payload-sdk"
          export PS4_SDK_SRC="$GITHUB_WORKSPACE/sdk"
          ./scripts/build_sdk.sh
      - name: gate daemon-world linkage only
        run: |
          export LLVM_READELF="$(command -v llvm-readelf-18 || command -v llvm-readelf)"
          NEEDED=$("$LLVM_READELF" -d build-sdk/orbisrpc_sdk.elf | grep NEEDED | sed 's/.*\[//;s/\]//')
          echo "$NEEDED"
          echo "$NEEDED" | grep -q libkernel_web.sprx || { echo "missing libkernel_web"; exit 1; }
          echo "$NEEDED" | grep -q libSceLibcInternal.sprx || { echo "missing libSceLibcInternal"; exit 1; }
          echo "$NEEDED" | grep -q libSceNet.sprx || { echo "missing libSceNet"; exit 1; }
          echo "$NEEDED" | grep -q libSceSystemService.sprx || { echo "missing libSceSystemService (foreground detection)"; exit 1; }
          if echo "$NEEDED" | grep -q 'libkernel\.so'; then echo "FORBIDDEN: app-world libkernel.so"; exit 1; fi
          echo "linkage OK"
      - name: install OpenOrbis packaging toolchain
        run: |
          mkdir -p "$HOME/OpenOrbis-PS4-Toolchain"
          curl -fsSL --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            | tar -xz --strip-components=2 -C "$HOME/OpenOrbis-PS4-Toolchain"
          ./scripts/setup-pkgtool-openssl.sh
      - name: build Setup PKG
        run: |
          export OO_PS4_TOOLCHAIN="$HOME/OpenOrbis-PS4-Toolchain"
          export PS4_PAYLOAD_SDK="$HOME/ps4-payload-sdk"
          export PS4_SDK_SRC="$GITHUB_WORKSPACE/sdk"
          make installer
          cp build-sdk/orbisrpc_sdk.elf orbisRPC.elf
          cp output/orbisRPC-1.1.pkg orbisRPC-setup-1.1.pkg
          test -s orbisRPC.elf
          test -s orbisRPC-setup-1.1.pkg
      - name: publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            orbisRPC.elf
            orbisRPC-setup-1.1.pkg
          generate_release_notes: true
          body: |
            ## Recommended install: standalone payload

            Download `orbisRPC.elf` and copy it to `/data/payloads/orbisRPC.elf` on your jailbroken PS4. Launch it with your GoldHEN payload loader. On first launch, follow the [token setup guide](https://github.com/SirHumza/orbisRPC/blob/main/docs/TOKEN_SETUP.md).

            For updates, replace the `.elf` and keep `/data/orbisRPC/config.json` so your settings and token remain in place.

            ## Optional Setup PKG

            `orbisRPC-setup-1.1.pkg` installs the graphical Setup app, which can install, configure, update, and uninstall the payload.

            ## Version 1.1

            Improves gateway heartbeats and reconnect recovery, hardens WebSocket frame and credential validation, protects configuration during reloads and updates, and adds broader installer and daemon regression coverage.

            Firmware support: 5.05–13.52; hardware testing: 9.00–13.52. See the [troubleshooting guide](https://github.com/SirHumza/orbisRPC/blob/main/docs/TROUBLESHOOTING.md) or [join the Discord](https://discord.gg/BWEyfcT7ZQ).

            orbisRPC uses a Discord user session token. Review [the security notes](https://github.com/SirHumza/orbisRPC/blob/main/SECURITY.md) before use; never share the token or config file.
