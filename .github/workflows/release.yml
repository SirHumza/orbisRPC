name: release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: gate fingerprint freshness
        run: |
          python3 scripts/update_fingerprint.py --fetch
          git diff --exit-code -- scripts/fingerprint.json orbisrpc/fingerprint_gen.h
      - name: fingerprint pipeline tests
        run: python3 -m unittest discover -s scripts/tests
      - name: checkout ps4-payload-sdk
        uses: actions/checkout@v5
        with:
          repository: ps4-payload-dev/sdk
          path: sdk
          fetch-depth: 0 # a raw SHA is not a branch/tag; checkout the repo then pin it
      - name: pin ps4-payload-sdk
        run: git -C sdk checkout 573b4a0 # Add 14.00 offsets; includes 959e4ed "Add 13.52 offsets"
      - name: install llvm
        run: sudo apt-get update -qq && sudo apt-get install -qy clang-18 lld-18 llvm-18
      - name: build SDK from source
        run: |
          make -C sdk DESTDIR="$HOME/ps4-payload-sdk" clean install
      - name: gate SDK firmware support
        run: |
          grep -q "case 0x1352:" sdk/crt/patch.c || {
            echo "FAIL: SDK lacks 13.52 offsets; payload cannot boot on 13.52"; exit 1; }
          echo "SDK has 13.52 offsets"
      - name: build SDK daemon payload
        run: |
          export PS4_PAYLOAD_SDK="$HOME/ps4-payload-sdk"
          export PS4_SDK_SRC="$GITHUB_WORKSPACE/sdk"
          ./scripts/build_sdk.sh
      - name: gate daemon-world linkage only
        run: |
          export LLVM_READELF="$(command -v llvm-readelf-18 || command -v llvm-readelf)"
          NEEDED=$("$LLVM_READELF" -d build-sdk/orbisrpc_sdk.elf | grep NEEDED | sed 's/.*\[//;s/\]//')
          echo "$NEEDED"
          echo "$NEEDED" | grep -q libkernel_web.sprx || { echo "missing libkernel_web"; exit 1; }
          echo "$NEEDED" | grep -q libSceLibcInternal.sprx || { echo "missing libSceLibcInternal"; exit 1; }
          echo "$NEEDED" | grep -q libSceNet.sprx || { echo "missing libSceNet"; exit 1; }
          echo "$NEEDED" | grep -q libSceSystemService.sprx || { echo "missing libSceSystemService (foreground detection)"; exit 1; }
          if echo "$NEEDED" | grep -q 'libkernel\.so'; then echo "FORBIDDEN: app-world libkernel.so"; exit 1; fi
          echo "linkage OK"
      - name: stage release asset names
        run: |
          cp build-sdk/orbisrpc_sdk.elf build-sdk/orbisrpc.bin
          python3 - <<'PY'
          import json
          for name in ("ps1", "ps2", "psp"):
              path = f"config/{name}.json"
              with open(path, encoding="utf-8") as f:
                  rows = json.load(f)
              assert isinstance(rows, list) and rows, path
              print(f"{path}: {len(rows)} entries")
          PY
          sha256sum build-sdk/orbisrpc_sdk.elf build-sdk/orbisrpc.bin \
            config/ps1.json config/ps2.json config/psp.json > build-sdk/SHA256SUMS.txt
      - name: attach ELF and retro index to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build-sdk/orbisrpc_sdk.elf
            build-sdk/orbisrpc.bin
            build-sdk/SHA256SUMS.txt
            config/ps1.json
            config/ps2.json
            config/psp.json
            LICENSE
            NOTICE
          generate_release_notes: true
          body: |
            ## Install

            Daemon payload `.elf` / `.bin`. The Setup PKG is experimental and
            is not attached.

            1. Put the payload at `/data/payloads/` and launch it from the
               GoldHEN payload list (or elfldr / BinLoader).
            2. First run creates `/data/orbisRPC/config.json`, then waits
               (no token yet).
            3. Over FTP, put your token in the `"token": "SET_ME"` slot.
            4. Re-run the payload. Launch a game and watch Discord.

            Optional offline retro index: copy `ps1.json`, `ps2.json` and
            `psp.json` to `/data/orbisRPC/`. PS1/PS2/PSP names then resolve
            with no network call; the remote index is only a fallback.
            Updates do not require deleting `/data/orbisRPC`.

            Firmware 9.00 verified on the 0.4 daemon; 1.1 is host-tested and
            its console checklist is pending. 13.x is CI-built and
            community-reported, not verified on the maintainer's desk.
            Issues → Discord: https://discord.gg/BWEyfcT7ZQ (`testers-chat`).
