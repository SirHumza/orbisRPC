name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: |
          KEY="f693088c6de3ae1d62b64ffe3454ecb8"
          HOST="sirhumza.github.io"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/orbisRPC/$KEY.txt\",\"urlList\":[\"https://$HOST/orbisRPC/\",\"https://$HOST/orbisRPC/best-ps4-tools.html\",\"https://$HOST/orbisRPC/about-orbisrpc.html\",\"https://$HOST/orbisRPC/guide.html\",\"https://$HOST/orbisRPC/llms.txt\"]}"
